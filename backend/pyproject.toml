[project]
name = "stratiqa-backend"
version = "0.1.0"
description = "STRATIQA — AI-Powered Business Operating System (backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
